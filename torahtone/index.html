<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TorahTone - Legal Policies</title>
    <style>
        :root {
            --bg-color: #FDFCF8;
            --text-color: #1A1A1A;
            --primary-color: #d9b55d;
            --secondary-color: #666666;
            --card-bg: #F5F3EC;
            --border-color: #E0E0E0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1A1A1A;
                --text-color: #E8E2D6;
                --primary-color: #C2A868;
                --secondary-color: #9C9484;
                --card-bg: #26221D;
                --border-color: #3A342B;
            }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 40px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 40px 32px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 16px -6px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
            text-align: center;
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--primary-color);
        }
        p {
            font-size: 16px;
            color: var(--secondary-color);
            margin-bottom: 32px;
        }
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .policy-link {
            display: block;
            padding: 16px 20px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
        }
        .policy-link:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TorahTone</h1>
        <p>Legal & Policy Documents</p>
        
        <div class="links-list">
            <a href="privacy.html" class="policy-link">Privacy Policy</a>
            <a href="terms.html" class="policy-link">Terms of Service</a>
            <a href="refund.html" class="policy-link">Refund Policy</a>
        </div>
    </div>
</body>
</html>
